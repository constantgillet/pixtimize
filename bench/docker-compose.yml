# Self-hosted image servers, benchmarked side by side: each one reads the same
# source files from the same S3 bucket and gets the same CPU / memory budget.
name: pixtimize-bench

x-limits: &limits
  cpus: ${BENCH_CPUS:-2}
  mem_limit: ${BENCH_MEM:-2g}

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: bench
  AWS_SECRET_ACCESS_KEY: benchbench

services:
  # RustFS: an S3-compatible server (MinIO no longer publishes Docker images).
  s3:
    image: ${S3_IMAGE:-rustfs/rustfs:1.0.4}
    environment:
      RUSTFS_ACCESS_KEY: bench
      RUSTFS_SECRET_KEY: benchbench
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      # Pixtimize uses virtual-hosted-style S3 URLs (bench.rustfs:9000).
      RUSTFS_SERVER_DOMAINS: rustfs
    networks:
      default:
        aliases: [rustfs, bench.rustfs]

  init:
    image: ${AWSCLI_IMAGE:-amazon/aws-cli:latest}
    depends_on: [s3]
    volumes: [./images:/images:ro]
    environment:
      <<: *s3-env
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        s3() { aws --endpoint-url http://rustfs:9000 "$$@"; }
        until s3 s3 ls >/dev/null 2>&1; do sleep 1; done
        s3 s3 mb s3://bench 2>/dev/null || true
        # Anonymous reads, for servers that fetch the source over plain HTTP.
        s3 s3api put-bucket-policy --bucket bench --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::bench/*"]}]}'
        s3 s3 cp --quiet --recursive /images s3://bench/ --exclude ".gitkeep"
        s3 s3 ls s3://bench/

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no

  pixtimize:
    build: ..
    <<: *limits
    depends_on: [s3, redis]
    environment:
      PORT: 3000
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: bench
      S3_ACCESS_KEY: bench
      S3_SECRET_KEY: benchbench
      REDIS_URL: redis://redis:6379
      RUST_LOG: warn
    ports: ["8081:3000"]

  imgproxy:
    image: ${IMGPROXY_IMAGE:-darthsim/imgproxy:latest}
    <<: *limits
    depends_on: [s3]
    environment:
      <<: *s3-env
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://rustfs:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: "true"
      IMGPROXY_LOG_LEVEL: warn
    ports: ["8082:8080"]

  imagor:
    image: ${IMAGOR_IMAGE:-shumc/imagor:latest}
    <<: *limits
    depends_on: [s3]
    environment:
      <<: *s3-env
      PORT: 8000
      IMAGOR_UNSAFE: 1
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://rustfs:9000
      S3_FORCE_PATH_STYLE: 1
      S3_LOADER_BUCKET: bench
      # Like Pixtimize, keep rendered images in S3 and serve them on repeat requests.
      S3_RESULT_STORAGE_BUCKET: bench
      S3_RESULT_STORAGE_BASE_DIR: imagor-results
    ports: ["8084:8000"]

  thumbor:
    image: ${THUMBOR_IMAGE:-minimalcompact/thumbor:latest}
    <<: *limits
    depends_on: [s3]
    environment:
      THUMBOR_PORT: 8888
      THUMBOR_NUM_PROCESSES: ${BENCH_CPUS:-2}
      ALLOW_UNSAFE_URL: "True"
      LOADER: thumbor.loaders.http_loader
      # Don't keep a local copy of source images: every service refetches them.
      STORAGE: thumbor.storages.no_storage
      RESULT_STORAGE: thumbor.result_storages.file_storage
      RESULT_STORAGE_STORES_UNSAFE: "True"
    ports: ["8085:8888"]

  imaginary:
    image: ${IMAGINARY_IMAGE:-h2non/imaginary:latest}
    <<: *limits
    depends_on: [s3]
    command: ["-enable-url-source", "-p", "9000"]
    ports: ["8083:9000"]

  k6:
    image: ${K6_IMAGE:-grafana/k6:latest}
    profiles: [tools]
    user: root  # write results into the bind mount on Linux hosts
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
